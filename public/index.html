<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MiniSearch</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<main class="wrap">
  <header class="brand">
    <h1>Mini<span>Search</span></h1>
    <p class="sub"><span id="stats">connecting…</span> <span id="country" class="pill" hidden></span></p>
  </header>
  <form id="form" role="search">
    <input id="q" type="search" placeholder="Search the crawl…" autocomplete="off" spellcheck="false" />
    <button type="submit">Search</button>
  </form>
  <p id="meta" aria-live="polite"></p>
  <div id="results"></div>
  <footer>BM25-ranked · press <kbd>/</kbd> to focus</footer>
</main>
<script src="/app.js"></script>
</body>
</html>
