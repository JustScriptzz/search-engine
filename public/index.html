<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MiniSearch</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<main class="wrap">
  <header class="top">
    <a class="brand" href="/">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="14" cy="14" r="9" fill="none" stroke="#c8f04a" stroke-width="3"/><path d="M21 21l7 7" stroke="#c8f04a" stroke-width="3" stroke-linecap="round"/></svg>
      <span>minisearch</span>
    </a>
    <div class="pills"><span id="stats" class="pill">connecting…</span><span id="country" class="pill accent" hidden></span></div>
  </header>
  <section class="hero" id="hero">
    <h1>Search your <em>crawl</em>.</h1>
    <p class="tag">BM25-ranked, zero tracking, tuned to your country.</p>
  </section>
  <form id="form" role="search" autocomplete="off">
    <div class="field">
      <svg class="fic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Try: search engine history…" spellcheck="false" aria-label="Search" />
      <kbd title="Focus search">/</kbd>
    </div>
  </form>
  <p id="meta" aria-live="polite"></p>
  <div id="results"></div>
  <footer>minisearch · local-first · <span id="foot-stats"></span></footer>
</main>
<script src="/app.js"></script>
</body>
</html>
