# Fly.io config for MiniSearch. See DEPLOY.md for the full walkthrough.
#
#   fly launch --no-deploy --name minisearch --region lhr
#   fly volumes create minisearch_data --size 5
#   fly secrets set EMBEDDING_API_KEY=nvapi-… COGITO_API_KEY=cog-live-…
#   fly deploy
#
# Two things in here are load-bearing, not taste:
# - auto_stop_machines = "off" with min_machines_running = 1: a stopped machine
#   means cold starts on every visit, and the health check flapping during
#   scale-to-zero would make deploys look broken. One machine always on.
# - The volume mount must match SERVER_INDEX_PATH, or the index is silently
#   written to the container's throwaway layer and lost on every deploy.

app = "minisearch"
primary_region = "lhr"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "90s"
    interval = "30s"
    timeout = "10s"
    method = "GET"
    path = "/healthz"

[[mounts]]
  source = "minisearch_data"
  destination = "/data"

[env]
  SERVER_INDEX_PATH = "/data/index.json"
  AUTO_FILL = "0"
